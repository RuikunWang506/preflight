name: CI

# Runs on pull requests and on pushes to main only. macOS runner minutes
# cost about 10 times Linux minutes on private repos, so plain branch pushes
# don't run CI (docs/PLAN-v0.1.md, skeleton decision 4).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Lint and tests (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  sandbox-linux:
    name: Sandbox tests (Linux, from M5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Sandbox tests
        # Sandbox tests arrive in M5. Until then pytest finds none and exits 5,
        # which counts as a pass here.
        run: |
          set +e
          uv run pytest -m sandbox
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No sandbox tests yet; they arrive in M5."
            exit 0
          fi
          exit "$code"
