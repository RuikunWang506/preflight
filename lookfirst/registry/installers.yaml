# Well-known installers that are normally run with `curl ... | sh`.
#
# A URL listed here is reported as "a well-known installer from its official site"
# (info) instead of "a site lookfirst can't vouch for" (medium). lookfirst still
# downloads the script and reads it with every rule: being listed is not a pass.
#
# sha256 is the copy lookfirst last saw at the first URL, on the date in `seen`.
# Installers change often, so a different hash is noted in the report, not alarmed on.
#
# To add one: the official docs must tell people to run it from that exact address.
# Add a `prefixes:` entry only for official versioned paths (like nvm's /v0.40.3/).

installers:
  - name: Homebrew
    urls:
      - https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    prefixes:
      - https://raw.githubusercontent.com/Homebrew/install/
    sha256: 5f333bbe53bc490e51e7ccb1df8779b3dd6ee73a1a7379efda216edb08ccb148
    seen: 2026-11-06

